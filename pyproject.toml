[project]
name = "adas-cc"
version = "0.1.0"
description = "ADAS-CC: a meta-agent that scans a repo and generates a Claude Code multi-agent system (subagents, skills, commands, hooks), orchestrated with LangGraph."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "langgraph>=0.2.60",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=0.3.0",
    "typer>=0.12.5",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
]

[project.scripts]
adas-cc = "adas_cc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adas_cc"]
